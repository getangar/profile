# ~/.config/tmux/tmux.conf
# Richiede tmux >= 3.1 (per il percorso in ~/.config). Ricarica con: prefix + r

# ---------------------------------------------------------------------------
# Terminale e colori
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,*-256color:Tc"   # true color
set -sg escape-time 0            # niente ritardo su ESC (fondamentale per vim/neovim)
set -g focus-events on           # autoread/focus per vim e simili
set -g history-limit 50000
set -g display-time 3000         # durata dei messaggi di tmux (ms)
set -g status-interval 5

# ---------------------------------------------------------------------------
# Prefix: C-a (più comodo di C-b). Doppio C-a manda C-a all'applicazione.
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Comportamento generale
# ---------------------------------------------------------------------------
set -g mouse on                  # click, scroll, resize dei pane con il mouse
set -g base-index 1              # finestre da 1, non da 0
setw -g pane-base-index 1        # pane da 1
set -g renumber-windows on       # rinumera quando chiudi una finestra
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S / #W"
set -g allow-rename off          # non far rinominare le finestre dai programmi
setw -g aggressive-resize on
set -s set-clipboard on          # integrazione clipboard via OSC 52 (iTerm2, kitty, WezTerm, Terminal.app recente)

# ---------------------------------------------------------------------------
# Ricarica configurazione
# ---------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf ricaricato"

# ---------------------------------------------------------------------------
# Finestre e pane
# ---------------------------------------------------------------------------
# split più intuitivi, mantenendo la directory corrente
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# navigazione tra pane: prefix + hjkl (stile vim) oppure prefix + frecce
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# navigazione senza prefix con Alt/Option + freccia
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# pane successivo / precedente (ciclico) e salto per numero
bind o select-pane -t :.+
bind O select-pane -t :.-
bind q display-panes -d 2000     # mostra i numeri per 2 s; premi il numero per saltare

# ridimensionamento (ripetibile tenendo premuto)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# finestre: Shift + freccia senza prefix, oppure prefix + Tab per l'ultima usata
bind -n S-Left  previous-window
bind -n S-Right next-window
bind Tab last-window

# spostare le finestre a destra/sinistra
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# chiudere pane/finestra senza conferma
bind x kill-pane
bind X kill-window

# zoom sul pane corrente
bind z resize-pane -Z

# ---------------------------------------------------------------------------
# Copy mode stile vi
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind p paste-buffer

# su macOS copia direttamente nella clipboard di sistema
if-shell "command -v pbcopy >/dev/null" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'"
# su Linux con Wayland / X11
if-shell "command -v wl-copy >/dev/null" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'"
if-shell "command -v xclip >/dev/null" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# ---------------------------------------------------------------------------
# Status bar: sobria, in fondo
# ---------------------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e] "
# a destra: PREFIX quando è premuto, pane attivo/totale, host, data, ora
set -g status-right "#[fg=#a6adc8]#{?client_prefix,#[fg=#f38ba8]PREFIX ,}#[fg=#a6adc8]pane #P/#{window_panes} #[fg=#585b70]| #[fg=#a6adc8]#h #[fg=#585b70]| #[fg=#cdd6f4]%a %d %b #[fg=#585b70]| #[fg=#cdd6f4]%H:%M "

setw -g window-status-format "#[fg=#a6adc8] #I:#W#F "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W#F "
setw -g window-status-activity-style "fg=#f9e2af"
setw -g monitor-activity on
set -g visual-activity off

# ---------------------------------------------------------------------------
# Bordi dei pane, con etichetta "numero: programma" in cima a ciascuno.
# Il pane attivo ha il bordo azzurro e l'etichetta evidenziata.
# ---------------------------------------------------------------------------
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#1e1e2e#,bg=#89b4fa#,bold],#[fg=#a6adc8]} #P: #{pane_current_command} "

# messaggi e copy mode
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"

